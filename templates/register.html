{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="auth-box">
        <h2>Регистрация</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p style="color:red; margin-bottom:10px;">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary full-width">Создать аккаунт</button>
        </form>
        <p style="margin-top:15px; text-align:center;">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </div>
</div>
{% endblock %}
